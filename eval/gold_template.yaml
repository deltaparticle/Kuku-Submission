# HAND-LABELLED GOLD SET  (copy this file to eval/gold.yaml)
#
# IMPORTANT: label these BEFORE you look at any model output, otherwise the check is not independent.
# Read ~12 episodes spread over the arc (e.g. 1, 3, 5, 12, 13, 16, 18, 24, 28, 31, 41, 42), and for each one
# write the promo you would post if you were the editor.
#
# Times are the screenplay's own times (mm:ss.ss) inside that episode.
# "hook" / "cliffhanger": a short phrase of the exact line (case-insensitive substring match).
# "never": a stretch you are SURE should not be picked (exposition, quiet scene, spoiler, policy risk).

promos:
  - episode: 0            # <- replace
    start: "00:00.00"
    end: "00:00.00"
    hook: "phrase from the opening line"
    cliffhanger: "phrase from the last line"
  # - episode: ...

never:
  - episode: 0
    start: "00:00.00"
    end: "00:00.00"
    why: "e.g. quiet exposition / late-arc spoiler"
